# twins_lab global settings
[project]
root   = "C:/workspace/twins_project"   # override with $env:TWINS_ROOT

# Backend commands use backend/.venv/Scripts/python.exe when present, otherwise sys.executable.
[ubuntu]
host = "51.44.213.47"
port = 22
user = "ubuntu"
ssh_key = "~/.ssh/assystem_key.pem"
remote_db_name = "pmis_twin"
remote_db_user = "project_twin"
backup_dir = "/var/backups/twins"

[ubuntu.database_sync]
# PostgreSQL natif : accès via .pgpass sur le serveur, sans prompt de mot de passe.
# Utiliser "compose" si PostgreSQL tourne dans le projet Compose distant.
postgres_mode = "compose"
remote_project = "/opt/project-twin/current"
remote_compose_project = "project-twin"
remote_compose_file = "/opt/project-twin/current/docker-compose.deploy.yml"
remote_env_file = "/opt/project-twin/runtime/.env"
remote_sudo = true
postgres_service = "postgres"
neo4j_service = "neo4j"
neo4j_database = "neo4j"
# Obligatoire pour --restore : renseigner les images compatibles avec le serveur.
postgres_image = "postgres:18-alpine"
neo4j_image = "neo4j:5.26.32"
local_postgres_port = 55432
local_neo4j_port = 57687
local_neo4j_http_port = 57474

[ubuntu.targets."sftp.prod.assystan"]
host = "51.44.213.47"
port = 22
user = "ubuntu"
ssh_key = "~/.ssh/assystem_key.pem"

# Les racines pointent par défaut vers les dossiers frères de devConsole.
# Les lanceurs propres au poste se déclarent dans lab.local.toml.
[workspace_projects."a2-connector".commands]
restore = ["dotnet", "restore", "a2-builder.slnx"]
build = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "build"]
test = ["dotnet", "run", "--project", "tests/A2.Connector.ContractTests", "-c", "Release"]
test-integrity = ["dotnet", "run", "--project", "tests/A2.Connector.IntegrationTests/Exports", "-c", "Release"]
inspect-ifc = ["dotnet", "run", "--project", "tests/A2.Connector.IntegrationTests/Exports", "-c", "Release", "--"]
test-api = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "test-api"]
publish = ["dotnet", "publish", "src/A2.Connector.Host", "-c", "Release", "-o", "artifacts/a2-connector"]
test-published = ["dotnet", "run", "--project", "tests/A2.Connector.BuildTests", "-c", "Release", "--", "artifacts/a2-connector"]
run = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "run"]
run-published = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "run-published"]
stop = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "stop"]
health = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "health"]
status = ["pwsh", "-NoProfile", "-File", "{a2_launcher}", "health"]
lint = ["dotnet", "format", "--verify-no-changes"]
