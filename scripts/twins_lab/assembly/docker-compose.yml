# Instance twins_project livrée par la chaîne d'assemblage.
# Toutes les valeurs variables viennent du fichier d'environnement généré par run-instance.ps1 (--env-file).
# Aucun secret n'est écrit ici. Seul le frontend publie un port : les bases restent sur le réseau interne.
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: twins
      POSTGRES_USER: twins
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ : le volume se monte sur /var/lib/postgresql (PGDATA est versionné dans ce dossier)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twins -d twins"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [back]

  neo4j:
    image: ${NEO4J_IMAGE}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [back]

  backend:
    image: twins-backend:${BUILD_VERSION}
    restart: unless-stopped
    env_file:
      - ./.env.run
    environment:
      # VERIFY : noms de variables à aligner sur backend/app/modules/shared/config.py et .env.example
      DATABASE_URL: postgresql://twins:${POSTGRES_PASSWORD}@postgres:5432/twins
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [back]

  frontend:
    image: twins-frontend:${BUILD_VERSION}
    restart: unless-stopped
    ports:
      - "${TWINS_HTTP_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [back]

networks:
  back: {}

volumes:
  pgdata: {}
  neo4jdata: {}
